<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Український онлайн радіо програвач — слухай найкращі радіостанції України">
  <title>D3.fm / Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    /* ================================================================
       D3.fm — Mobile-First Premium CSS
       ================================================================ */

    /* ======== Reset ======== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #09090B;
      --bg-card: #18181B;
      --bg-card-hover: #27272A;
      --bg-surface: #18181B;
      --text: #FAFAFA;
      --text-dim: #A1A1AA;
      --accent: #06B6D4;
      --accent-glow: rgba(6, 182, 212, 0.4);
      --accent-soft: rgba(6, 182, 212, 0.12);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Inter', 'Manrope', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* All SVG icons inherit currentColor */
    svg {
      color: currentColor;
    }

    /* ======== Header ======== */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-surface);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .header__logo {
      font-family: 'Manrope', 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--accent);
    }

    .header__sep {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.08);
    }

    .header__subtitle {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* ======== Layout ======== */
    .app {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    /* ======== Sidebar — hidden on mobile, shown on desktop ======== */
    .sidebar {
      display: none;
    }

    .sidebar__title {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--text-dim);
      margin-bottom: 12px;
      padding: 0 4px;
    }

    /* ======== Genre Button (shared) ======== */
    .genre-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }

    .genre-btn--active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    .genre-btn__icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .genre-btn__icon svg {
      width: 15px;
      height: 15px;
    }

    .genre-btn__count {
      margin-left: auto;
      font-size: 0.65rem;
      opacity: 0.4;
    }

    /* ======== Main content ======== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ================================================================
       PLAYER HERO — Mobile: 55vh native music-player feel
       ================================================================ */
    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 55vh;
      padding: 32px 20px 28px;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 60%),
        var(--bg);
      flex-shrink: 0;
      position: relative;
    }

    .player__station {
      font-family: 'Manrope', 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      text-align: center;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player__song {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 40px;
      text-align: center;
    }

    .player__controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    /* ================================================================
       PLAY BUTTON — Vinyl Record Style
       ================================================================ */
    .play-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      position: relative;
      transition: transform 0.2s ease;
      background: transparent;
    }

    /* Vinyl disc background on ::after so it spins independently */
    .play-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background-color: #111;
      background-image:
        url('assets/vinyl.png'),
        radial-gradient(circle at 50% 50%, #111 18%, transparent 18.5%),
        radial-gradient(circle at 50% 50%, transparent 30%, rgba(255, 255, 255, 0.03) 30.5%, transparent 31%),
        radial-gradient(circle at 50% 50%, transparent 42%, rgba(255, 255, 255, 0.025) 42.5%, transparent 43%),
        radial-gradient(circle at 50% 50%, transparent 54%, rgba(255, 255, 255, 0.02) 54.5%, transparent 55%),
        radial-gradient(circle at 50% 50%, transparent 66%, rgba(255, 255, 255, 0.015) 66.5%, transparent 67%),
        radial-gradient(circle at 50% 50%, transparent 78%, rgba(255, 255, 255, 0.02) 78.5%, transparent 79%),
        conic-gradient(from 0deg, #1a1a1a 0%, #222 25%, #1a1a1a 50%, #222 75%, #1a1a1a 100%);
      background-size: cover, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.06),
        0 0 30px rgba(6, 182, 212, 0.2);
      z-index: 0;
    }

    /* Centre label — accent circle with play/pause icon */
    .play-btn::before {
      content: '';
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
      z-index: 1;
    }

    .play-btn svg {
      width: 32px;
      height: 32px;
      fill: #000;
      stroke: #000;
      position: relative;
      z-index: 2;
    }

    .play-btn:active {
      transform: scale(0.94);
    }

    /* Spinning vinyl when playing */
    .play-btn--playing::after {
      animation: vinyl-spin 3s linear infinite;
      box-shadow:
        0 0 0 3px rgba(6, 182, 212, 0.2),
        0 0 40px var(--accent-glow);
    }

    @keyframes vinyl-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (hover: hover) {
      .play-btn:hover {
        transform: scale(1.05);
      }

      .play-btn:hover::after {
        box-shadow:
          0 0 0 3px rgba(6, 182, 212, 0.3),
          0 0 50px var(--accent-glow);
      }
    }

    /* ======== Mute Button ======== */
    .mute-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .mute-btn svg {
      width: 20px;
      height: 20px;
    }

    .mute-btn:active {
      transform: scale(0.88);
    }

    .mute-btn--muted {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    /* Hidden native audio */
    #player {
      display: none;
    }

    /* ================================================================
       MOBILE GENRE BAR — horizontal scroll, big touch targets
       ================================================================ */
    .genre-bar-mobile {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-surface);
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    /* Hide scrollbar on mobile genre bar */
    .genre-bar-mobile::-webkit-scrollbar {
      display: none;
    }

    .genre-bar-mobile {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .genre-bar-mobile .genre-btn {
      white-space: nowrap;
      padding: 10px 18px;
      font-size: 0.82rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      min-height: 42px;
    }

    .genre-bar-mobile .genre-btn--active {
      background: var(--accent);
      color: #000;
    }

    .genre-bar-mobile .genre-btn__count {
      display: none;
    }

    .genre-bar-mobile .genre-btn__icon {
      width: 16px;
      height: 16px;
    }

    .genre-bar-mobile .genre-btn__icon svg {
      width: 14px;
      height: 14px;
    }

    /* ================================================================
       STATIONS LIST
       ================================================================ */
    .stations-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 12px 100px;
    }

    .stations-area__head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .stations-area__title {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .stations-area__count {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* Mobile: single column */
    .stations-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
    }

    /* ======== Station Card ======== */
    .station-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: none;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .station-card:active {
      transform: scale(0.98);
      background: var(--bg-card-hover);
    }

    @media (hover: hover) {
      .station-card:hover {
        background: var(--bg-card-hover);
      }
    }

    .station-card--active {
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .station-card__icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .station-card__icon svg {
      width: 20px;
      height: 20px;
      color: var(--text-dim);
    }

    .station-card__icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .station-card__info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .station-card__name {
      font-family: 'Manrope', 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .station-card__meta {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .station-card__bitrate {
      font-size: 0.65rem;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ======== Favorite Button ======== */
    .fav-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .fav-btn svg {
      width: 20px;
      height: 20px;
      transition: fill 0.2s, color 0.2s;
    }

    .fav-btn svg.fav-active {
      color: var(--accent);
      fill: var(--accent);
    }

    .fav-btn:active {
      transform: scale(0.85);
    }

    /* ======== Loading / Error states ======== */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .state-msg__spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.06);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ======== Scrollbar (desktop) ======== */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* ================================================================
       DESKTOP — min-width: 768px
       ================================================================ */
    @media (min-width: 768px) {

      /* Layout: horizontal with sidebar */
      .app {
        flex-direction: row;
      }

      /* Show sidebar */
      .sidebar {
        display: flex;
        flex-direction: column;
        width: 220px;
        min-width: 220px;
        background: var(--bg-surface);
        padding: 20px 12px;
        gap: 2px;
        overflow-y: auto;
      }

      /* Hide mobile genre bar */
      .genre-bar-mobile {
        display: none !important;
      }

      /* Header */
      .header {
        padding: 16px 28px;
        gap: 14px;
      }

      .header__logo {
        font-size: 1.25rem;
      }

      .header__subtitle {
        font-size: 0.7rem;
        letter-spacing: 2px;
      }

      /* Player hero — auto height to avoid cutoff */
      .player {
        min-height: 360px;
        height: auto;
        padding: 40px 32px 36px;
        background:
          radial-gradient(ellipse at 30% -20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
          radial-gradient(ellipse at 70% -10%, rgba(6, 182, 212, 0.04) 0%, transparent 50%),
          var(--bg);
      }

      .player__station {
        font-size: 2rem;
        max-width: 600px;
      }

      .player__song {
        font-size: 0.85rem;
        margin-bottom: 32px;
      }

      /* Play button — smaller on desktop */
      .play-btn {
        width: 160px;
        height: 160px;
      }

      .play-btn::before {
        width: 56px;
        height: 56px;
      }

      .play-btn svg {
        width: 28px;
        height: 28px;
      }

      .mute-btn {
        width: 44px;
        height: 44px;
      }

      .mute-btn svg {
        width: 20px;
        height: 20px;
      }

      /* Stations area */
      .stations-area {
        padding: 24px 28px 40px;
      }

      .stations-area__head {
        margin-bottom: 16px;
      }

      .stations-area__title {
        font-size: 1rem;
      }

      /* Grid: multi-column */
      .stations-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 8px;
      }

      /* Cards slightly bigger */
      .station-card {
        padding: 14px 16px;
        gap: 14px;
      }

      .station-card__icon {
        width: 44px;
        height: 44px;
      }

      .station-card__name {
        font-size: 0.85rem;
      }

      .station-card__meta {
        font-size: 0.7rem;
      }

      .station-card__bitrate {
        font-size: 0.65rem;
        padding: 3px 8px;
      }

      /* Sidebar genre hover */
      .genre-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }

      .genre-btn--active:hover {
        background: var(--accent);
        color: #000;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <span class="header__logo">
      <img src="assets/logo.svg" alt="D3.fm Logo" style="height: 36px; display: block;">
    </span>
    <span class="header__sep"></span>
    <span class="header__subtitle">Dashboard</span>
  </header>

  <!-- Hidden native audio element -->
  <audio id="player"></audio>

  <div class="app">

    <!-- Sidebar — Genres (desktop) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__title">Жанри</div>
      <!-- Buttons injected by JS -->
    </aside>

    <div class="main">

      <!-- Mobile genre bar -->
      <div class="genre-bar-mobile" id="genre-bar-mobile"></div>

      <!-- Player hero -->
      <section class="player" id="player-hero">
        <div class="player__station" id="player-station">Оберіть станцію</div>
        <div class="player__song" id="player-song">—</div>

        <div class="player__controls">
          <button class="mute-btn" id="mute-btn" title="Mute / Unmute"><i data-lucide="volume-2"></i></button>
          <button class="play-btn" id="play-btn" title="Play / Pause"><i data-lucide="play"></i></button>
          <div style="width:48px"></div> <!-- Spacer for visual centering -->
        </div>
      </section>

      <!-- Stations grid -->
      <section class="stations-area" id="stations-area">
        <div class="state-msg" id="loading-msg">
          <div class="state-msg__spinner"></div>
          <div>Завантаження станцій...</div>
        </div>
      </section>

    </div>
  </div>

  <script>
    // ================================================================
    //  CONSTANTS & DOM REFS
    // ================================================================
    const API_URL =
      'https://de1.api.radio-browser.info/json/stations/search' +
      '?country=Ukraine&hidebroken=true&order=clickcount&reverse=true';

    // Жанри, які ми хочемо виділити в сайдбарі
    const GENRE_WHITELIST = [
      'favorites', 'pop', 'rock', 'news', 'electronic', 'jazz', 'rap',
      'dance', 'classical', 'folk', 'ambient', 'talk',
      'hits', 'chillout', 'lounge', 'techno', 'house'
    ];

    const audio = document.getElementById('player');
    const playBtn = document.getElementById('play-btn');
    const muteBtn = document.getElementById('mute-btn');
    const playerStation = document.getElementById('player-station');
    const playerSong = document.getElementById('player-song');
    const stationsArea = document.getElementById('stations-area');
    const loadingMsg = document.getElementById('loading-msg');
    const sidebar = document.getElementById('sidebar');
    const genreBarMobile = document.getElementById('genre-bar-mobile');

    // ================================================================
    //  STATE
    // ================================================================
    let allStations = [];   // Після дедуплікації
    let genreMap = {};   // { genre: [station, ...] }
    let currentGenre = 'all';
    let currentStation = null;
    let isPlaying = false;
    let isMuted = false;
    let savedVolume = 0.8;
    let favorites = JSON.parse(localStorage.getItem('d3fm_favorites')) || [];

    // ================================================================
    //  1. DEDUPLICATION — залишаємо найкращий bitrate
    // ================================================================
    function deduplicateStations(stations) {
      const map = new Map();

      stations.forEach((s) => {
        const key = s.name.trim().toLowerCase();

        if (!map.has(key)) {
          map.set(key, s);
        } else {
          // Залишаємо станцію з вищим bitrate
          const existing = map.get(key);
          if ((s.bitrate || 0) > (existing.bitrate || 0)) {
            map.set(key, s);
          }
        }
      });

      return Array.from(map.values());
    }

    // ================================================================
    //  2. GENRE EXTRACTION — парсимо tags, рахуємо популярні
    // ================================================================
    function buildGenreMap(stations) {
      const map = {
        all: stations,
        favorites: stations.filter(s => favorites.includes(s.stationuuid))
      };

      stations.forEach((s) => {
        if (!s.tags) return;

        // tags — рядок через кому
        const tags = s.tags.toLowerCase().split(',').map(t => t.trim()).filter(Boolean);

        tags.forEach((tag) => {
          if (GENRE_WHITELIST.includes(tag)) {
            if (!map[tag]) map[tag] = [];
            map[tag].push(s);
          }
        });
      });

      return map;
    }

    // ================================================================
    //  3. SONG METADATA — шукаємо що доступно
    // ================================================================
    function getSongInfo(station) {
      // Radio-Browser іноді повертає поле codec або homepage,
      // але не має live metadata — виводимо заглушку
      if (station.last_changetime_iso8601) {
        return 'Прямий ефір';
      }
      return 'Прямий ефір';
    }

    // ================================================================
    //  RENDER — Genre buttons
    // ================================================================
    // Lucide icon name → genre label
    const GENRE_CONFIG = {
      all: { icon: 'radio', label: 'Усі' },
      favorites: { icon: 'heart', label: 'Улюблене' },
      pop: { icon: 'mic', label: 'Pop' },
      rock: { icon: 'guitar', label: 'Rock' },
      news: { icon: 'newspaper', label: 'News' },
      electronic: { icon: 'cpu', label: 'Electronic' },
      jazz: { icon: 'music', label: 'Jazz' },
      rap: { icon: 'mic-vocal', label: 'Rap' },
      dance: { icon: 'disc-3', label: 'Dance' },
      classical: { icon: 'music-2', label: 'Classical' },
      folk: { icon: 'music-4', label: 'Folk' },
      ambient: { icon: 'moon', label: 'Ambient' },
      talk: { icon: 'message-circle', label: 'Talk' },
      hits: { icon: 'star', label: 'Hits' },
      chillout: { icon: 'snowflake', label: 'Chillout' },
      lounge: { icon: 'wine', label: 'Lounge' },
      techno: { icon: 'zap', label: 'Techno' },
      house: { icon: 'home', label: 'House' },
    };

    function renderGenres() {
      // Будуємо впорядкований список жанрів: спочатку "all", потім по кількості
      const orderedGenres = ['all'];
      GENRE_WHITELIST.forEach(g => {
        if (genreMap[g] && genreMap[g].length > 0) orderedGenres.push(g);
      });

      const makeBtn = (genre) => {
        const btn = document.createElement('button');
        btn.className = 'genre-btn' + (genre === currentGenre ? ' genre-btn--active' : '');
        btn.dataset.genre = genre;

        const cfg = GENRE_CONFIG[genre] || { icon: 'radio', label: genre };
        const count = genreMap[genre] ? genreMap[genre].length : 0;

        btn.innerHTML = `<span class="genre-btn__icon"><i data-lucide="${cfg.icon}"></i></span>${cfg.label}<span class="genre-btn__count">${count}</span>`;

        btn.addEventListener('click', () => {
          currentGenre = genre;
          renderGenres();
          renderStations();
        });

        return btn;
      };

      // Desktop sidebar
      sidebar.querySelectorAll('.genre-btn').forEach(b => b.remove());
      orderedGenres.forEach(g => sidebar.appendChild(makeBtn(g)));

      // Mobile bar
      genreBarMobile.innerHTML = '';
      orderedGenres.forEach(g => genreBarMobile.appendChild(makeBtn(g)));

      // Re-render Lucide icons inside buttons
      lucide.createIcons();
    }

    // ================================================================
    //  RENDER — Station cards
    // ================================================================
    function renderStations() {
      const stations = genreMap[currentGenre] || [];

      const cfg = GENRE_CONFIG[currentGenre] || { icon: 'radio', label: currentGenre };

      // Заголовок
      let html = `
        <div class="stations-area__head">
          <div class="stations-area__title">${cfg.label}</div>
          <div class="stations-area__count">${stations.length} станцій</div>
        </div>
        <div class="stations-grid" id="stations-grid"></div>
      `;

      stationsArea.innerHTML = html;
      const grid = document.getElementById('stations-grid');

      stations.forEach((s) => {
        const card = document.createElement('div');
        card.className = 'station-card' +
          (currentStation && currentStation.stationuuid === s.stationuuid ? ' station-card--active' : '');
        card.dataset.uuid = s.stationuuid;

        // Іконка (favicon або Lucide fallback)
        const iconContent = s.favicon
          ? `<img src="${s.favicon}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<i data-lucide=radio></i>';lucide.createIcons({nameAttr:'data-lucide',attrs:{class:'lucide-fallback'}})">`
          : '<i data-lucide="radio"></i>';

        const bitrateMatch = s.name.match(/(\d{2,3})\s*(kbps|kb\/s)/i);
        let extractedBitrate = 0;
        let cleanName = s.name;

        if (bitrateMatch) {
          extractedBitrate = parseInt(bitrateMatch[1], 10);
          // Видаляємо знайдений бітрейт із назви (також прибираємо зайві дефіси в кінці)
          cleanName = cleanName.replace(bitrateMatch[0], '').replace(/\s*[-|]\s*$/, '').trim();
        }

        const apiBitrate = parseInt(s.bitrate, 10);
        const finalBitrate = (apiBitrate && apiBitrate > 0) ? apiBitrate : extractedBitrate;
        const bitrateLabel = finalBitrate > 0 ? finalBitrate + ' kbps' : '';

        const isFav = favorites.includes(s.stationuuid);
        card.innerHTML = `
          <div class="station-card__icon">${iconContent}</div>
          <div class="station-card__info">
            <div class="station-card__name">${escapeHtml(cleanName)}</div>
            <div class="station-card__meta">${escapeHtml(s.tags ? s.tags.split(',').slice(0, 3).join(', ') : '')}</div>
          </div>
          ${bitrateLabel ? `<span class="station-card__bitrate">${bitrateLabel}</span>` : ''}
          <button class="fav-btn" data-uuid="${s.stationuuid}" title="Додати в улюблене">
            <i data-lucide="heart" class="${isFav ? 'fav-active' : ''}"></i>
          </button>
        `;

        card.addEventListener('click', () => playStation(s));

        const favBtn = card.querySelector('.fav-btn');
        favBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const uuid = favBtn.dataset.uuid;
          if (favorites.includes(uuid)) {
            favorites = favorites.filter(id => id !== uuid);
          } else {
            favorites.push(uuid);
          }
          localStorage.setItem('d3fm_favorites', JSON.stringify(favorites));

          // Rebuild favorites in map
          genreMap.favorites = allStations.filter(st => favorites.includes(st.stationuuid));

          // Update sidebar/mobile counts dynamically
          renderGenres();

          if (currentGenre === 'favorites') {
            card.remove(); // smoothly remove card without resetting scroll
          } else {
            const svg = favBtn.querySelector('svg');
            if (svg) {
              if (favorites.includes(uuid)) {
                svg.classList.add('fav-active');
              } else {
                svg.classList.remove('fav-active');
              }
            }
          }
        });

        grid.appendChild(card);
      });

      // Render Lucide icons in cards
      lucide.createIcons();
    }

    // ================================================================
    //  PLAYBACK
    // ================================================================
    function setPlayIcon(playing) {
      playBtn.innerHTML = playing
        ? '<i data-lucide="pause"></i>'
        : '<i data-lucide="play"></i>';
      lucide.createIcons({ nameAttr: 'data-lucide' });
    }

    function setMuteIcon(muted) {
      muteBtn.innerHTML = muted
        ? '<i data-lucide="volume-x"></i>'
        : '<i data-lucide="volume-2"></i>';
      lucide.createIcons({ nameAttr: 'data-lucide' });
    }

    function playStation(station) {
      currentStation = station;

      // Оновлюємо плеєр
      audio.src = station.url_resolved;
      audio.play().catch(() => { /* autoplay policy */ });
      isPlaying = true;

      // UI
      playerStation.textContent = station.name;
      playerSong.textContent = getSongInfo(station);
      setPlayIcon(true);
      playBtn.classList.add('play-btn--playing');

      // Оновлюємо active-картку
      document.querySelectorAll('.station-card').forEach(c => c.classList.remove('station-card--active'));
      const activeCard = document.querySelector(`.station-card[data-uuid="${station.stationuuid}"]`);
      if (activeCard) activeCard.classList.add('station-card--active');

      // Media Session API
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: station.name,
          artist: 'D3.fm',
          album: getSongInfo(station),
          artwork: [
            { src: 'assets/favicon.svg', sizes: '512x512', type: 'image/svg+xml' },
            { src: 'assets/favicon.png', sizes: '512x512', type: 'image/png' }
          ]
        });
      }
    }

    // Play / Pause toggle
    playBtn.addEventListener('click', () => {
      if (!currentStation) return;

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        setPlayIcon(false);
        playBtn.classList.remove('play-btn--playing');
      } else {
        audio.play().catch(() => { });
        isPlaying = true;
        setPlayIcon(true);
        playBtn.classList.add('play-btn--playing');
      }
    });

    // Media Session API Handlers
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => {
        if (currentStation && !isPlaying) playBtn.click();
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        if (currentStation && isPlaying) playBtn.click();
      });
    }

    // ================================================================
    //  MUTE / UNMUTE
    // ================================================================
    audio.volume = 0.8;

    muteBtn.addEventListener('click', () => {
      if (isMuted) {
        // Unmute — відновлюємо гучність
        audio.volume = savedVolume;
        isMuted = false;
        muteBtn.classList.remove('mute-btn--muted');
        setMuteIcon(false);
      } else {
        // Mute — зберігаємо та вимикаємо
        savedVolume = audio.volume || 0.8;
        audio.volume = 0;
        isMuted = true;
        muteBtn.classList.add('mute-btn--muted');
        setMuteIcon(true);
      }
    });

    // Якщо потік обірвався
    audio.addEventListener('error', () => {
      playerSong.textContent = '⚠ Потік недоступний';
      setPlayIcon(false);
      playBtn.classList.remove('play-btn--playing');
      isPlaying = false;
    });

    // ================================================================
    //  HELPERS
    // ================================================================
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ================================================================
    //  INIT — Fetch & Render
    // ================================================================
    async function init() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const raw = await res.json();

        if (!raw.length) {
          stationsArea.innerHTML = '<div class="state-msg">Станцій не знайдено.</div>';
          return;
        }

        // 1. Дедуплікація
        allStations = deduplicateStations(raw);

        // 2. Побудова карти жанрів
        genreMap = buildGenreMap(allStations);

        // 3. Рендер
        renderGenres();
        renderStations();

      } catch (err) {
        stationsArea.innerHTML = `
          <div class="state-msg">
            <i data-lucide="alert-triangle" style="width:20px;height:20px;margin-bottom:8px"></i><br>
            Не вдалося завантажити станції.<br>
            <span style="font-size:0.75rem;color:#555">${escapeHtml(err.message)}</span>
          </div>`;
        lucide.createIcons();
        console.error('Init error:', err);
      }
    }

    // Ініціалізуємо Lucide для статичних елементів, потім завантажуємо дані
    lucide.createIcons();
    init();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
</body>

</html>
