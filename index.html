<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Український онлайн радіо програвач — слухай найкращі радіостанції України">
  <title>D3.fm / Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <!-- Scroll to Top Button -->
  <button id="scroll-to-top" class="scroll-to-top" title="Вгору">
    <i data-lucide="arrow-up"></i>
  </button>

  <!-- Sticky Mini Player -->
  <div class="mini-player" id="mini-player">
    <button class="mini-player__vinyl" id="mini-play-btn" title="Play / Pause">
      <i data-lucide="play"></i>
    </button>
    <div class="mini-player__info">
      <div class="mini-player__station" id="mini-station">Оберіть станцію</div>
    </div>
    <div class="mini-player__controls">
      <button class="mini-btn fav-btn-mini" id="mini-fav-btn" title="Додати в улюблене"><i
          data-lucide="heart"></i></button>
      <button class="mini-btn" id="mini-mute-btn" title="Mute / Unmute"><i data-lucide="volume-2"></i></button>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <span class="header__logo">
      <img src="assets/logo.svg" alt="D3.fm Logo" style="height: 36px; display: block;">
    </span>
    <span class="header__sep"></span>
    <span class="header__subtitle">Dashboard</span>
    <div class="header__search">
      <input type="text" id="station-search" placeholder="Пошук...">
    </div>
    <button class="header__drive-btn" id="drive-mode-btn" title="Режим водіння">
      <i data-lucide="car"></i>
    </button>
  </header>

  <!-- Hidden native audio element -->
  <audio id="player"></audio>

  <div class="app">

    <!-- Sidebar — Genres (desktop) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__title">Жанри</div>
      <!-- Buttons injected by JS -->
    </aside>

    <div class="main">

      <!-- Mobile genre bar -->
      <div class="genre-bar-mobile" id="genre-bar-mobile"></div>

      <!-- Player hero -->
      <section class="player" id="player-hero">
        <div class="player__station" id="player-station">Оберіть станцію</div>
        <div class="player__song" id="player-song">—</div>

        <div class="player__controls">
          <button class="mute-btn" id="mute-btn" title="Mute / Unmute"><i data-lucide="volume-2"></i></button>
          <button class="play-btn" id="play-btn" title="Play / Pause"><i data-lucide="play"></i></button>
          <button class="fav-btn-hero" id="hero-fav-btn" title="Додати в улюблене"><i data-lucide="heart"></i></button>
        </div>
        <div class="player__nav-controls">
          <button class="nav-btn" id="prev-btn" title="Попередня станція"><i data-lucide="skip-back"></i></button>
          <button class="nav-btn" id="next-btn" title="Наступна станція"><i data-lucide="skip-forward"></i></button>
        </div>
      </section>

      <!-- Stations grid -->
      <section class="stations-area" id="stations-area">
        <div class="state-msg" id="loading-msg">
          <div class="state-msg__spinner"></div>
          <div>Завантаження станцій...</div>
        </div>
      </section>

    </div>
  </div>

  <script src="assets/app.js" defer></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }
  </script>
  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js'
    data-cf-beacon='{"token": "7c0c38f9324d4e4d9cd317b338858b50"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>

</html>
